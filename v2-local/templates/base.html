<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}MedPeek{% endblock %}</title>
    <script>
        document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="ocean" aria-hidden="true">
        <svg class="wave wave-1" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0,120 C240,180 480,60 720,110 C960,160 1200,70 1440,120 L1440,200 L0,200 Z"/></svg>
        <svg class="wave wave-2" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0,140 C300,90 540,190 780,140 C1020,90 1260,170 1440,130 L1440,200 L0,200 Z"/></svg>
        <svg class="wave wave-3" viewBox="0 0 1440 200" preserveAspectRatio="none"><path d="M0,160 C200,130 460,190 720,160 C980,130 1220,185 1440,155 L1440,200 L0,200 Z"/></svg>
    </div>

    {% block content %}{% endblock %}

    <div id="toast-area" class="toast-area" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
