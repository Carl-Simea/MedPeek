<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>X Ray Examiner</title>
        
        <script>
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        </script>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body class="d-flex flex-column vh-100">
        <!-- Added theme toggle to the home page -->
        <header class="d-flex justify-content-end p-3 w-100">
            <button id="theme-toggle" class="btn btn-sm btn-ghost" type="button">🌓 Theme</button>
        </header>

        <main class="container text-center d-flex flex-column align-items-center justify-content-center flex-grow-1" style="opacity: 1; transform: none;">
            <h1 class="mb-4 fw-bold">Welcome to The X Ray image examiner</h1>
            <p class="text-muted mb-5">AI-powered chest radiograph analysis and anomaly detection.</p>
            <a href="/results" class="btn btn-primary btn-lg px-5 py-3 shadow-sm rounded-pill">Get Started</a>
        </main>
        
        <footer class="text-center pb-4 text-muted small">
            <p class="mb-1">Hacktober Fest 2026</p>
            &copy; SIMEA TECH. All rights reserved.
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
